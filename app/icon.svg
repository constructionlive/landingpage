<svg width="32" height="32" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg" role="img">
	<title>construction.live</title>
	<!-- The mark is inset in a white disc rather than full-bleed: the rings are
	     open shapes, and without a surface behind them a dark tab bar swallows
	     the gap that makes them read as two rings instead of one thick C. -->
	<circle cx="140" cy="140" r="140" fill="#FFFFFF"/>
	<g fill="none" stroke="#e8531a" transform="translate(140,140) scale(0.9)">
		<path d="M90.1,63.1 A110,110 0 1 1 90.1,-63.1" stroke-width="34"/>
		<path d="M39.9,47.5 A62,62 0 1 1 39.9,-47.5" stroke-width="30"/>
		<circle cx="0" cy="0" fill="#e8531a" r="30" stroke="none"/>
	</g>
</svg>
